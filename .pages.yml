# Configurazione del pannello di redazione (Pages CMS, pagescms.org).
#
# Chi deve modificare i testi del sito entra su app.pagescms.org con il proprio
# account GitHub, apre questo repository e trova i moduli descritti qui sotto:
# un campo per ogni pezzo di testo, in italiano, senza vedere codice.
# Appena salva, il sito viene ricostruito e pubblicato da solo.

media:
  - name: fotografie
    label: Fotografie
    input: assets/img/foto
    output: assets/img/foto
    extensions: [jpg, jpeg, png, webp]
  - name: documenti
    label: Report in PDF
    input: dist/report
    output: dist/report
    extensions: [pdf]

content:

  # ------------------------------------------------------------------- HOME
  - name: home
    label: Home
    path: contenuti/home.yml
    type: file
    icon: home
    fields:
      - { name: titolo, label: Titolo principale, type: string }
      - { name: sottotitolo, label: Testo di apertura, type: text }
      - { name: foto_copertina, label: Foto di copertina, type: image, options: { media: fotografie, path: foto } }
      - { name: foto_copertina_descrizione, label: Descrizione della foto di copertina, type: text }
      - name: campagne
        label: I tre riquadri delle campagne
        type: object
        list: true
        fields:
          - { name: anni, label: Anni, type: string }
          - { name: nome, label: Nome del progetto, type: string }
          - { name: descrizione, label: Descrizione breve, type: text }
          - { name: pagina, label: Pagina collegata, type: select, options: { values: [campagna-2022-2023, campagna-2023-2024, campagna-2025-2026] } }
      - name: numeri
        label: I numeri in evidenza
        type: object
        list: true
        fields:
          - { name: valore, label: Numero, type: string }
          - { name: etichetta, label: Che cosa conta, type: string }
          - { name: dettaglio, label: Precisazione, type: string }
      - name: fiume
        label: "Sezione: il fiume Aniene"
        type: object
        fields:
          - { name: titolo, label: Titolo, type: string }
          - { name: paragrafi, label: Paragrafi, type: text, list: true }
      - name: progetto
        label: "Sezione: il progetto"
        type: object
        fields:
          - { name: titolo, label: Titolo, type: string }
          - { name: sottotitolo, label: Sottotitolo, type: string }
          - name: tappe
            label: Le tappe del percorso
            type: object
            list: true
            fields:
              - { name: anni, label: Anni, type: string }
              - { name: nome, label: Nome, type: string }
              - { name: testo, label: Testo, type: text }
          - name: chi
            label: Chi ne fa parte
            type: object
            fields:
              - { name: titolo, label: Titolo, type: string }
              - { name: testo, label: Testo, type: text }
          - name: cosa
            label: Cosa facciamo
            type: object
            fields:
              - { name: titolo, label: Titolo, type: string }
              - name: voci
                label: Attività
                type: object
                list: true
                fields:
                  - { name: titolo, label: Titolo, type: string }
                  - { name: testo, label: Testo, type: text }
          - { name: foto, label: Foto, type: image, options: { media: fotografie, path: foto } }
          - { name: foto_descrizione, label: Descrizione della foto, type: text }
      - name: contratto
        label: "Sezione: il Contratto di Fiume"
        type: object
        fields:
          - { name: titolo, label: Titolo, type: string }
          - name: cosa_e
            label: Cos'è il Contratto di Fiume
            type: object
            fields:
              - { name: titolo, label: Titolo, type: string }
              - { name: paragrafi, label: Paragrafi, type: text, list: true }
          - name: aniene
            label: Il Contratto di Fiume Aniene
            type: object
            fields:
              - { name: titolo, label: Titolo, type: string }
              - { name: paragrafi, label: Paragrafi, type: text, list: true }
              - name: numeri
                label: Numeri in evidenza
                type: object
                list: true
                fields:
                  - { name: valore, label: Numero, type: string }
                  - { name: etichetta, label: Che cosa conta, type: string }
              - { name: link, label: Indirizzo del sito, type: string }
              - { name: link_testo, label: Testo del collegamento, type: string }
      - name: citizen_science
        label: "Sezione: la citizen science"
        type: object
        fields:
          - { name: titolo, label: Titolo, type: string }
          - { name: paragrafi, label: Paragrafi, type: text, list: true }
          - { name: card_titolo, label: Titolo delle schede, type: string }
          - name: card
            label: Schede
            type: object
            list: true
            fields:
              - { name: titolo, label: Titolo, type: string }
              - { name: testo, label: Testo, type: text }
          - { name: foto, label: Foto, type: image, options: { media: fotografie, path: foto } }
          - { name: foto_descrizione, label: Descrizione della foto, type: text }
      # Fuori dalla pagina dal 25 novembre 2026, per la decisione della riunione
      # del 6: il testo resta qui d'archivio ma non compare sul sito, e
      # modificarlo non cambia niente finché la sezione non viene rimessa.
      - name: metodologia
        label: "Metodologia e strumenti — ARCHIVIO, non in pagina"
        type: object
        fields:
          - { name: titolo, label: Titolo, type: string }
          - { name: paragrafi, label: Paragrafi, type: text, list: true }
          - { name: approfondisci, label: Testo del bottone, type: string }
          - name: fresh_water_watch
            label: Riquadro Fresh Water Watch
            type: object
            fields:
              - { name: etichetta, label: Sopratitolo, type: string }
              - { name: titolo, label: Titolo, type: string }
              - { name: testo, label: Testo, type: text }
              - { name: link, label: Indirizzo del sito, type: string }
              - { name: link_testo, label: Testo del collegamento, type: string }
              - { name: link_passi, label: Indirizzo dei passaggi per caricare i rilievi, type: string }
              - { name: link_passi_testo, label: Testo del secondo collegamento, type: string }
              - name: qr
                label: I codici QR
                type: object
                list: true
                fields:
                  - { name: immagine, label: File del codice, type: string }
                  - { name: etichetta, label: Titolo, type: string }
                  - { name: descrizione, label: Descrizione, type: text }
      - name: obiettivi
        label: "Sezione: gli obiettivi"
        type: object
        fields:
          - { name: titolo, label: Titolo, type: string }
          - { name: intro, label: Testo introduttivo, type: text }
          - { name: voci, label: Obiettivi, type: text, list: true }
      - name: ringraziamenti
        label: "Sezione: ringraziamenti"
        type: object
        fields:
          - { name: titolo, label: Titolo, type: string }
          - { name: testo, label: Testo, type: text }

