# Pagina CAMPAGNA 2023-2024.
# La dashboard legge i dati da dati/campagna-2023-2024.json: non si modificano qui.

titolo: Campagna 2023-2024
sottotitolo: >-
  Aniene WaterLab esce dalla città: nove stazioni da Subiaco al Tevere, undici
  mesi di campionamenti e tre discese in gommone.
foto_copertina: foto/studenti-fiume.jpg
foto_copertina_descrizione: >-
  Studentesse e studenti lungo l'Aniene durante un campionamento.

introduzione:
  paragrafi:
    - >-
      Il progetto Aniene WaterLab, finanziato dal programma «Periferiacapitale»
      della Fondazione Charlemagne, ha attivato dal mese di dicembre 2023 una
      **campagna annuale di monitoraggio ambientale partecipato** delle acque del
      fiume Aniene, tramite attività sul campo, sessioni di formazione, azioni
      di networking territoriale e attività di advocacy.
    - >-
      La proposta di progetto è nata con lo scopo di dare continuità al lavoro
      svolto negli ultimi anni in favore della tutela ecologica dei fiumi romani
      dalle associazioni territoriali e da tutte le persone volontarie impegnate
      nella protezione di questo ecosistema. Il percorso si è occupato del
      monitoraggio delle acque dell'Aniene non solo nel tratto urbano, come
      nelle scorse annualità, ma anche **nel tratto extra-urbano**, includendo
      ulteriori zone critiche dal punto di vista ambientale.
    - >-
      Le attività del monitoraggio partecipato, fondate sui principi della
      citizen science, hanno coinvolto direttamente attiviste e attivisti,
      singole persone e associazioni locali, impegnati nella raccolta dei dati e
      nella diffusione di pratiche e conoscenze utili alla preservazione degli
      ecosistemi fluviali. La validazione scientifica dei dati raccolti, a cura
      della **Dott.ssa Bruna Gumiero**, ecologa fluviale dell'Università di Bologna,
      e la conseguente divulgazione dei risultati emersi è un passo fondamentale
      per favorire un dialogo orizzontale e inclusivo tra società civile,
      esperti accademici, tecnici e istituzioni.
    - >-
      In questa annualità, grazie al coinvolgimento di Roma Adventure ASD, il
      progetto ha previsto anche diverse discese in gommone lungo il fiume. I
      monitoraggi effettuati in occasione di queste discese hanno permesso di
      ampliare lo sguardo su quasi tutto il tratto fluviale, contribuendo ad
      ampliare la conoscenza sulla sua salute ecomorfologica: sono state
      individuate e mappate diverse situazioni critiche relative a discariche,
      scarichi abusivi e altre problematiche che andrebbero propriamente
      indagate.

