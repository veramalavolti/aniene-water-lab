# Le righe che cominciano con # sono commenti: servono a spiegare i campi e non
# compaiono sul sito.

titolo: I monitoraggi partecipati sul fiume Aniene
sottotitolo: >-
  La piattaforma unica dedicata a tutte le attività di monitoraggio civico del
  fiume Aniene, da parte di chi lo ha vissuto e continua a farlo. Dal 2021
  associazioni, volontarie e volontari, scuole, ricercatori e ricercatrici
  monitorano la qualità dell'acqua dell'Aniene, da Subiaco alla confluenza nel
  Tevere. Qui trovi il percorso, la metodologia, tutti i dati raccolti in forma
  aperta, l'interpretazione dei risultati e la condivisione con le istituzioni
  e le comunità locali.
foto_copertina: foto/fiume-subiaco.jpg
foto_copertina_descrizione: >-
  L'Aniene a Subiaco, dove il fiume conserva un carattere ancora naturale.

# I tre riquadri cliccabili che portano alle pagine delle campagne.
campagne:
  - anni: 2021 | 2022-2023
    nome: Walk Up Aniene e RomaUp
    descrizione: Le prime mappature e cinque stazioni nel tratto urbano.
    pagina: campagna-2022-2023
  - anni: 2023-2024
    nome: Aniene WaterLab
    descrizione: Nove stazioni da Subiaco al Tevere e le prime discese in gommone.
    pagina: campagna-2023-2024
  - anni: 2025-2026
    nome: Aniene WaterLab
    descrizione: Punti fissi, immissioni campionate in gommone e macroinvertebrati.
    pagina: campagna-2025-2026

