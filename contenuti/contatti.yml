segnalazioni:
  titolo: Segnalaci qualcosa
  intro: >-
    Hai visto uno scarico, una discarica, una moria di pesci o qualcosa che non
    torna lungo il fiume? Scrivici: ogni segnalazione viene letta e, quando
    possibile, verificata durante le uscite di monitoraggio.
  email: segreteria@asud.net
  nota: >-
    Il modulo apre il tuo programma di posta con il messaggio già pronto. Se
    preferisci, puoi scrivere direttamente all'indirizzo qui sopra.
  campi:
    nome: Il tuo nome
    email: La tua email
    luogo: Dove l'hai visto
    messaggio: Che cosa hai visto
    invia: Prepara la segnalazione

bollettino:
  titolo: Il bollettino dell'Aniene
  intro: >-
    Gli aggiornamenti sullo stato del fiume, le campagne di monitoraggio e le
    iniziative della rete. Qui raccogliamo gli articoli pubblicati man mano che
    i dati vengono validati e restituiti.
  articoli:
    - titolo: Un report per capire come sta l'Aniene
      data: ""
      occhiello: A Sud
      testo: >-
        La presentazione del report di monitoraggio e quello che i dati
        raccontano sullo stato di salute del fiume.
      link: https://asud.net/ultima/report-per-capire-come-sta-l-aniene/
  iscrizione:
    titolo: Resta aggiornata, resta aggiornato
    testo: >-
      Per ricevere gli aggiornamenti sulle prossime campagne di monitoraggio e
      sulle restituzioni pubbliche, scrivici all'indirizzo qui sopra indicando
      «bollettino dell'Aniene» nell'oggetto.
