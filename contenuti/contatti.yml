  intro: >-
    Associazioni, enti e sostenitori che hanno preso parte alle quattro campagne
    di monitoraggio, dal 2021 a oggi. Il monitoraggio civico esiste perché
    esistono loro, e le centinaia di persone che ci hanno messo tempo e mani.
    Accanto a chi trovi qui lavorano il **Contratto di Fiume Aniene**, **Fresh
    Water Watch**, la **Rete Orti in Comune** e **ARPA Lazio**, con cui
    confrontiamo dati e segnalazioni.
  supervisione:
    titolo: Supervisione scientifica
    testo: >-
      La validazione scientifica dei dati raccolti è a cura della **Dott.ssa
      Bruna Gumiero**, ecologa fluviale dell'Università di Bologna.
