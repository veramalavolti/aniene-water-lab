# ------------------------------------------------------------- il bollettino

bollettino:
  etichetta: Il bollettino dell'Aniene
  titolo: Come sta il fiume, raccontato mano a mano
  intro: >-
    Ogni volta che una campagna si chiude e i dati vengono validati, li
    raccontiamo: che cosa abbiamo trovato, dove, e che cosa chiediamo alle
    istituzioni. Qui trovi gli articoli pubblicati finora.
  in_evidenza:
    occhiello: In evidenza · A Sud
    titolo: In gommone per capire come sta l'Aniene
    autore: Alessandro Coltré
    sommario: >-
      I dati della seconda campagna di monitoraggio in gommone, da Ponte Lucano
      alla confluenza con il Tevere: **36 punti analizzati** in tre uscite, tra
      il 20 maggio e il 22 giugno 2026.
    paragrafi:
      - >-
        Il quadro che emerge è quello di una **contaminazione microbiologica
        diffusa**, che peggiora via via che il fiume si avvicina alla città.
        Escherichia coli supera i limiti di riferimento della direttiva europea
        sulle acque di balneazione in **23 siti su 36**, e i coliformi fecali
        ricevono un giudizio scarso o cattivo in 26 siti.
      - >-
        Anche i parametri chimici segnalano pressione: l'ammonio è critico in 25
        siti, i nitrati in 22, i fosfati in 20, mentre l'ossigeno disciolto
        risulta scarso in 12 siti, due dei quali in condizioni di **anossia**. I
        punti peggiori sono gli impianti di sollevamento di Città Giardino e del
        fosso di Sant'Agnese, e Salario Center, poco prima della confluenza.
      - >-
        Il monitoraggio mostra che molti affluenti, e anche i depuratori di
        Guidonia, Tivoli e Roma Est, immettono nel fiume acque non
        completamente depurate. Per questo le associazioni chiedono
        **verifiche urgenti con campionamenti ufficiali di ARPA Lazio**, un
        monitoraggio dell'intero tratto nello stesso giorno, controlli su
        fognature e depuratori e la pubblicazione dei dati istituzionali in
        formato aperto.
    link: https://asud.net/ultima/report-per-capire-come-sta-l-aniene/
    link_testo: Leggi l'articolo completo su asud.net
    foto: foto/gommone-prelievo-2.jpg
    foto_descrizione: >-
      Il campionamento di un'immissione nel fiume durante la seconda campagna in
      gommone.
  newsletter:
    titolo: Iscriviti alla newsletter
    testo: >-
      Il bollettino dell'Aniene viaggia dentro la newsletter di A Sud: nuove
      campagne, dati appena validati, restituzioni pubbliche e appuntamenti sul
      fiume. Un'email ogni tanto, niente di più.
    link: https://dona.asud.net/?act=sndg&rec=OTdbLl03NDljODljMGRjZjQzZDZkYzFhNTJmNTdkMzhjZGUxNlsuXTg5
    link_testo: Iscriviti alla newsletter di A Sud

# ------------------------------------------------------------- segnalazioni

segnalazioni:
  titolo: Segnalaci quello che vedi
  intro: >-
    Hai visto uno **scarico**, una **discarica**, una **moria di pesci** o
    qualcosa che non torna lungo il fiume? Scrivici: ogni segnalazione viene
    letta e, quando possibile, verificata durante le uscite di monitoraggio.
  email: segreteria@asud.net
  nota: >-
    Il modulo apre il tuo programma di posta con il messaggio già pronto: il
    sito non invia nulla da solo e non conserva i tuoi dati. Se preferisci,
    puoi scrivere direttamente all'indirizzo qui sopra.
  campi:
    nome: Il tuo nome
    email: La tua email
    luogo: Dove l'hai visto
    messaggio: Che cosa hai visto
    invia: Prepara la segnalazione
  consigli:
    titolo: Cosa ci aiuta di più
    voci:
      - >-
        Il **punto preciso**: un nome di ponte, una via, o le coordinate del
        telefono.
      - Il **giorno e l'ora** in cui hai visto la cosa.
      - Una o due **fotografie**, che puoi allegare all'email.

# ------------------------------------------- la rete (ultima sezione: grazie)

rete:
