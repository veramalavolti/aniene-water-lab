# Impostazioni generali del sito: nome, menu, piè di pagina.
# Valgono per tutte le pagine.

sito:
  nome: Aniene Water Lab
  claim: Citizen science · Qualità delle acque
  descrizione: >-
    La piattaforma dei monitoraggi partecipati sul fiume Aniene: il percorso
    dal 2021 a oggi, la metodologia, i dati aperti delle campagne e
    l'interpretazione dei risultati.
  lingua: it

# Il bottone in fondo alla barra in alto.
testata:
  voce: Esplora i dati
  # passando sopra il bottone si apre l'elenco delle campagne: ogni voce
  # porta direttamente alla dashboard di quella campagna
  ancora: dashboard

# L'ordine del menu in alto. "pagina" è il nome del file della pagina.
menu:
  - pagina: index
    voce: Home
  - pagina: citizen-science
    voce: Citizen science
  - pagina: campagna-2022-2023
    voce: 2021 | 2022-2023
  - pagina: campagna-2023-2024
    voce: 2023-2024
  - pagina: campagna-2025-2026
    voce: 2025-2026
  - pagina: contatti
    voce: Contatti e bollettino

pie_di_pagina:
  testo: >-
    Aniene Water Lab raccoglie i dati dei monitoraggi civici sul fiume Aniene
    realizzati da A Sud, Insieme per l'Aniene APS e dalla rete di associazioni
    del Contratto di Fiume Aniene, con la supervisione scientifica di Bruna
    Gumiero.
  dati: >-
    I dati di questo sito sono aperti e scaricabili in formato CSV dalle
    dashboard di ogni campagna.
  licenza: >-
    Testi e dati sono rilasciati con licenza Creative Commons BY-SA 4.0. Le
    fotografie appartengono a chi le ha scattate.
  link:
    - voce: A Sud
      url: https://asud.net
    - voce: Insieme per l'Aniene APS
      url: https://www.aniene.it
    - voce: Contratto di Fiume Aniene
      url: https://progetti.regione.lazio.it/contrattidifiume/
    - voce: Fresh Water Watch
      url: https://www.freshwaterwatch.org

# ------------------------------------------------------- come si usa la dashboard
# Questo testo compare accanto a ogni dashboard del sito: si scrive una volta
# sola e vale per tutte le campagne.

guida_dashboard:
  titolo: Come si usa questa dashboard
  intro: >-
    La dashboard serve a **farle delle domande**: dove peggiora il fiume, quando
    è successo, quali punti superano le soglie di legge. Si muove in quattro
    mosse.
  passi:
    - >-
      **Scegli un parametro** dal menu in alto. Il grafico mostra solo quello,
      con le sue soglie e la sua unità di misura.
    - >-
      **Scegli la vista.** *Andamento* mette i prelievi in ordine di tempo,
      *Profilo* li mette in fila da monte a valle, *Mappa* li dispone sul corso
      reale del fiume.
    - >-
      **Accendi e spegni i punti** con i tasti colorati sotto il grafico. Il
      tasto *Mostra tutti* li riaccende tutti insieme, senza doverli
      riselezionare uno a uno.
    - >-
      **Passa sopra le linee tratteggiate**: sono le soglie di qualità. Il
      riquadro che compare dice quale valore è stato superato e quali possono
      esserne le cause.
  esempi_invito: Clicca qui per qualche esempio di esplorazione
  esempi:
    - titolo: Da dove in poi il fiume non è più balneabile?
      testo: >-
        Scegli **Escherichia coli** e la vista *Profilo*: i punti si allineano
        da monte a valle e si vede a occhio dove la colonna supera la linea
        delle 1.000 UFC, il limite di balneabilità.
    - titolo: Quando è arrivato lo scarico?
      testo: >-
        Scegli **ammonio** e la vista *Andamento*, poi lascia acceso un solo
        punto. I picchi isolati raccontano un episodio; una riga sempre alta
        racconta un apporto continuo.
    - titolo: Il fiume respira meglio d'inverno?
      testo: >-
        Scegli **ossigeno disciolto** in *Andamento* e tieni accesi due o tre
        punti: l'acqua fredda trattiene più ossigeno, quindi un calo estivo è
        normale, un calo invernale no.
    - titolo: Dove sta il salto?
      testo: >-
        Scegli **conducibilità** e la vista *Mappa*: i cerchi si colorano per
        livello e si individua subito il tratto in cui il valore cambia
        bruscamente rispetto ai punti vicini.
