<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aniene Water Lab">
  <title>Aniene Water Lab</title>
  <rect width="64" height="64" rx="14" fill="#1A3340"/>
  <!-- il corso del fiume, dalle sorgenti alla confluenza -->
