  <!-- i punti di campionamento lungo il fiume -->
  <circle cx="42.6" cy="18.4" r="3.6" fill="#F0EDE6"/>
  <circle cx="36" cy="32" r="3.6" fill="#F0EDE6"/>
  <circle cx="29.4" cy="45.6" r="3.6" fill="#F0EDE6"/>
