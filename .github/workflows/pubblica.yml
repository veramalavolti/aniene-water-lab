# Ricostruisce e pubblica il sito a ogni modifica dei contenuti.
#
# Quando qualcuno salva un testo dal pannello di redazione, Pages CMS scrive il
# file in contenuti/ e questo flusso rigenera le pagine in dist/, le rimette nel
# repository e le pubblica su GitHub Pages: il sito si aggiorna da solo in un
# paio di minuti, senza passare da nessun altro servizio.

name: Pubblica il sito

on:
  push:
    branches: [main]
    paths:
      - 'contenuti/**'
      - 'templates/**'
      - 'assets/**'
      - 'dati/**'
      - 'build.py'
      - '.github/workflows/pubblica.yml'
  workflow_dispatch:

permissions:
  contents: write
  # servono a pubblicare le pagine su GitHub Pages
  pages: write
  id-token: write

concurrency:
  group: pubblica
  cancel-in-progress: true

jobs:
  # Primo lavoro: generare il sito e preparare il pacchetto delle pagine.
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa le librerie
        # pypdfium2 conta le pagine dei report, Pillow legge le dimensioni delle
        # immagini: senza, la ricostruzione automatica perderebbe quei dati
        run: pip install --quiet pyyaml jinja2 pypdfium2 pillow

      - name: Costruisci il sito
        run: python3 build.py

      - name: Salva le pagine aggiornate
        run: |
          git config user.name "Aniene Water Lab"
          git config user.email "noreply@github.com"
          git add dist
          if git diff --staged --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m "Ricostruisce il sito dai contenuti aggiornati"
            git push
          fi

      # GitHub Pages va acceso una volta sola a mano, in Settings → Pages del
      # repository, scegliendo «GitHub Actions» come Source: questo flusso non
      # ha i permessi per cambiare le impostazioni del repository da solo.
      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica le pagine
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Secondo lavoro: pubblicare davvero.
  #
  # Dev'essere separato dal primo. Il passo di pubblicazione cerca il pacchetto
  # caricato interrogando le API di GitHub, e un pacchetto creato dal lavoro
  # ancora in corso non risulta: messi insieme, fallisce con «No artifacts named
  # github-pages were found».
  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pagine.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: pagine
        uses: actions/deploy-pages@v4
