# Ricostruisce e pubblica il sito a ogni modifica dei contenuti.
#
# Quando qualcuno salva un testo dal pannello di redazione, Pages CMS scrive il
# file in contenuti/ e questo flusso rigenera le pagine in dist/, le rimette nel
# repository e le pubblica su GitHub Pages: il sito si aggiorna da solo in un
# paio di minuti, senza passare da nessun altro servizio.

name: Pubblica il sito

on:
  push:
    branches: [main]
    paths:
      - 'contenuti/**'
      - 'templates/**'
      - 'assets/**'
      - 'dati/**'
      - 'build.py'
      - '.github/workflows/pubblica.yml'
  workflow_dispatch:

permissions:
  contents: write
  # servono a pubblicare le pagine su GitHub Pages
  pages: write
  id-token: write

concurrency:
  group: pubblica
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pagine.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa le librerie
        # pypdfium2 serve a contare le pagine dei report: senza, la ricostruzione
        # automatica toglierebbe quel dato dalle schede dei documenti
        run: pip install --quiet pyyaml jinja2 pypdfium2

      - name: Costruisci il sito
        run: python3 build.py

      - name: Salva le pagine aggiornate
        run: |
          git config user.name "Aniene Water Lab"
          git config user.email "noreply@github.com"
          git add dist
          if git diff --staged --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m "Ricostruisce il sito dai contenuti aggiornati"
            git push
          fi

      # ----------------------------------------------- la pubblicazione vera
      # GitHub Pages serve le pagine dallo stesso repository in cui stanno i
      # contenuti: non serve collegare nessun altro servizio e l'indirizzo è
      # pubblico, visibile a chiunque abbia il link.
      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Carica le pagine
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Pubblica
        id: pagine
        uses: actions/deploy-pages@v4
